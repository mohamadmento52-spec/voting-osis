<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Hasil - Quick Count SMPN 4 Monano</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg: #f1f5f9; --danger: #ef4444; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #fff; 
            width: 95%; 
            max-width: 550px; 
            padding: 30px; 
            border-radius: 28px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            text-align: center; 
        }
        
        /* Layout Grafik */
        .chart { 
            display: flex; 
            justify-content: space-around; 
            align-items: flex-end; 
            height: 300px; 
            margin: 60px 0 30px 0; 
            border-bottom: 3px solid #f1f5f9; 
            padding-bottom: 10px; 
        }
        .bar-wrap { 
            width: 30%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100%; 
            justify-content: flex-end; 
        }
        
        /* Animasi Batang */
        .bar { 
            width: 70%; 
            background: linear-gradient(to top, #4f46e5, #818cf8); 
            border-radius: 12px 12px 4px 4px; 
            transition: height 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            min-height: 5px; 
            position: relative; 
        }

        /* Nilai Angka di Atas Batang */
        .val { 
            position: absolute; 
            top: -35px; 
            width: 100%; 
            font-size: 13px; 
            font-weight: 800; 
            color: var(--primary); 
            white-space: nowrap; 
        }
        
        /* Styling Foto Paslon Lokal */
        .bar-photo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 15px;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: #f1f5f9; /* Warna cadangan jika foto tidak ada */
        }

        .label-paslon { 
            margin-top: 8px; 
            font-weight: 800; 
            color: #334155; 
            font-size: 16px; 
        }

        .total-suara { 
            background: #eef2ff; 
            padding: 15px; 
            border-radius: 16px; 
            font-size: 22px; 
            font-weight: 800; 
            color: var(--primary); 
            margin-top: 25px; 
            border: 1px solid #e0e7ff; 
        }

        .status-badge { 
            font-size: 11px; 
            color: #10b981; 
            margin-top: 15px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .btn-delete {
            margin-top: 30px;
            background: none;
            border: 2px solid #f1f5f9;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-delete:hover { 
            border-color: var(--danger); 
            color: var(--danger); 
            background: #fef2f2; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0; color: #1e293b; line-height: 1.2;">HASIL PERHITUNGAN SUARA PILKETOS</h2>
    <p style="font-size: 14px; color: #64748b; margin-top: 8px;">SMPN 4 MONANO - 2026/2027</p>

    <div class="chart">
        <div class="bar-wrap">
            <div id="bar1" class="bar" style="height: 0%;">
                <div class="val" id="val1">0</div>
            </div>
            <img src="paslon1.png" alt="01" class="bar-photo">
            <div class="label-paslon">01</div>
        </div>

        <div class="bar-wrap">
            <div id="bar2" class="bar" style="height: 0%;">
                <div class="val" id="val2">0</div>
            </div>
            <img src="paslon2.png" alt="02" class="bar-photo">
            <div class="label-paslon">02</div>
        </div>

        <div class="bar-wrap">
            <div id="bar3" class="bar" style="height: 0%;">
                <div class="val" id="val3">0</div>
            </div>
            <img src="paslon3.png" alt="03" class="bar-photo">
            <div class="label-paslon">03</div>
        </div>
    </div>

    <div id="total" class="total-suara">Total: 0 Suara</div>
    <div id="statusUpdate" class="status-badge">Menghubungkan ke Server...</div>

    <button class="btn-delete" onclick="hapusData()">🗑️ Kosongkan Database</button>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyngXTAZyyfsbN52APIY0UhoXvF2NSHpYoDa-Eb8Vo_2bZ-1TWlgF2SjTxGbF5zUIll/exec";

    async function muatData() {
        const statusEl = document.getElementById("statusUpdate");
        try {
            const response = await fetch(SCRIPT_URL + "?nocache=" + new Date().getTime());
            const data = await response.json();
            
            let counts = { 1: 0, 2: 0, 3: 0 };
            let totalValid = 0;

            if (Array.isArray(data) && data.length > 0) {
                data.forEach(row => {
                    let pilihan = row[2];
                    if(counts[pilihan] !== undefined) {
                        counts[pilihan]++;
                        totalValid++;
                    }
                });
            }

            [1, 2, 3].forEach(i => {
                const persen = totalValid > 0 ? (counts[i] / totalValid * 100).toFixed(1) : 0;
                // Skala tinggi agar visual tetap proporsional (max 85% dari container chart)
                const visualHeight = totalValid > 0 ? (counts[i] / Math.max(...Object.values(counts)) * 85) : 0;
                
                document.getElementById(`bar${i}`).style.height = (visualHeight + 5) + "%";
                document.getElementById(`val${i}`).innerText = `${counts[i]} (${persen}%)`;
            });

            document.getElementById("total").innerText = `Total: ${totalValid} Suara`;
            statusEl.innerText = "● LIVE - Terakhir Update: " + new Date().toLocaleTimeString();
            statusEl.style.color = "#10b981";

        } catch (error) {
            statusEl.innerText = "✖ Koneksi Terputus - Menyambung kembali...";
            statusEl.style.color = "#ef4444";
        }
    }

    async function hapusData() {
        const pw = prompt("Konfirmasi Admin - Masukkan Password:");
        if (pw === 'admin123') {
            if (confirm("Hapus seluruh data suara secara permanen?")) {
                try {
                    const btn = document.querySelector('.btn-delete');
                    btn.innerText = "Menghapus...";
                    btn.disabled = true;

                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "clear" })
                    });

                    alert("Data berhasil dibersihkan!");
                    muatData();
                } catch (e) {
                    alert("Gagal menghubungi server.");
                } finally {
                    const btn = document.querySelector('.btn-delete');
                    btn.innerText = "🗑️ Kosongkan Database";
                    btn.disabled = false;
                }
            }
        } else if (pw !== null) {
            alert("Password Salah!");
        }
    }

    // Interval update otomatis setiap 5 detik
    setInterval(muatData, 5000);
    // Inisialisasi pertama kali
    muatData();
</script>
</body>
</html>
