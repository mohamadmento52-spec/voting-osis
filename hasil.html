<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Hasil - Quick Count</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --bg: #f1f5f9; --danger: #ef4444; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #fff; width: 90%; max-width: 500px; padding: 40px; border-radius: 24px; box-shadow: 0 4px 25px rgba(0,0,0,0.05); text-align: center; }
        
        .chart { display: flex; justify-content: space-around; align-items: flex-end; height: 300px; margin: 50px 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .bar-wrap { width: 28%; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
        
        .bar { 
            width: 80%; 
            background: linear-gradient(to top, #4f46e5, #818cf8); 
            border-radius: 8px 8px 0 0; 
            transition: height 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            min-height: 5px; 
            position: relative; 
        }

        .val { position: absolute; top: -35px; width: 100%; font-size: 14px; font-weight: 700; color: var(--primary); }
        .label-paslon { margin-top: 15px; font-weight: 700; color: #334155; }
        .total-suara { background: #f5f3ff; padding: 15px; border-radius: 12px; font-size: 20px; font-weight: 800; color: var(--primary); margin-top: 20px; }
        .status-badge { font-size: 11px; color: #10b981; margin-top: 10px; font-weight: 600; text-transform: uppercase; }

        /* Tombol Hapus */
        .btn-delete {
            margin-top: 25px;
            background: none;
            border: 2px solid #e2e8f0;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-delete:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: #fef2f2;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0; color: #1e293b;">PEROLEHAN SUARA PEMILIHAN KETUA & WAKIL KETUA OSIS SMPN 4 MONANO </h2>
    <p style="font-size: 14px; color: #64748b; margin-top: 5px;">Masa Bakti 2026/2027</p>

    <div class="chart">
        <div class="bar-wrap">
            <div id="bar1" class="bar" style="height: 0%;">
                <div class="val" id="val1">0</div>
            </div>
            <div class="label-paslon">01 (Ilyas & Dion) </div>
        </div>
        <div class="bar-wrap">
            <div id="bar2" class="bar" style="height: 0%;">
                <div class="val" id="val2">0</div>
            </div>
            <div class="label-paslon">02 (Alvin & Fadli)</div>
        </div>
        <div class="bar-wrap">
            <div id="bar3" class="bar" style="height: 0%;">
                <div class="val" id="val3">0</div>
            </div>
            <div class="label-paslon">03 (Febiola & Tri)</div>
        </div>
    </div>

    <div id="total" class="total-suara">Total: 0 Suara</div>
    <div id="statusUpdate" class="status-badge">Menghubungkan...</div>

    <button class="btn-delete" onclick="hapusData()">🗑️ Kosongkan Database</button>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyngXTAZyyfsbN52APIY0UhoXvF2NSHpYoDa-Eb8Vo_2bZ-1TWlgF2SjTxGbF5zUIll/exec";

    async function muatData() {
        const statusEl = document.getElementById("statusUpdate");
        try {
            const response = await fetch(SCRIPT_URL + "?nocache=" + new Date().getTime());
            const data = await response.json();
            
            let counts = { 1: 0, 2: 0, 3: 0 };
            let totalValid = 0;

            if (Array.isArray(data) && data.length > 0) {
                data.forEach(row => {
                    let pilihan = row[2];
                    if(counts[pilihan] !== undefined) {
                        counts[pilihan]++;
                        totalValid++;
                    }
                });
            }

            [1, 2, 3].forEach(i => {
                const persen = totalValid > 0 ? (counts[i] / totalValid * 100).toFixed(1) : 0;
                document.getElementById(`bar${i}`).style.height = persen + "%";
                document.getElementById(`val${i}`).innerText = `${counts[i]} (${persen}%)`;
            });

            document.getElementById("total").innerText = `Total: ${totalValid} Suara`;
            statusEl.innerText = "● Terhubung - Terupdate: " + new Date().toLocaleTimeString();
            statusEl.style.color = "#10b981";

        } catch (error) {
            statusEl.innerText = "✖ Koneksi Terputus";
            statusEl.style.color = "#ef4444";
        }
    }

    async function hapusData() {
        const pw = prompt("Masukkan Password Konfirmasi:");
        // Ganti 'admin123' dengan password yang Anda inginkan
        if (pw === 'admin123') {
            if (confirm("Apakah Anda yakin ingin MENGHAPUS SEMUA DATA suara? Tindakan ini tidak bisa dibatalkan.")) {
                try {
                    const btn = document.querySelector('.btn-delete');
                    btn.innerText = "Menghapus...";
                    btn.disabled = true;

                    await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify({ action: "clear" })
                    });

                    alert("Data berhasil dikosongkan.");
                    muatData();
                } catch (e) {
                    alert("Gagal menghapus data.");
                } finally {
                    const btn = document.querySelector('.btn-delete');
                    btn.innerText = "🗑️ Kosongkan Database";
                    btn.disabled = false;
                }
            }
        } else {
            alert("Password Salah!");
        }
    }

    setInterval(muatData, 5000);
    muatData();
</script>
</body>

</html>
